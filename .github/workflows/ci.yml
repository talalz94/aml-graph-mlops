name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install pinned dependencies
        run: uv sync --locked

      # One task list for CI and for `uv run poe check` on a laptop. CI never downloads
      # AMLworld: the smoke step runs the whole pipeline on generated data.
      - name: Lint, format check, unit tests and pipeline smoke test
        run: uv run poe check
